spring.application.name=users-service
server.port=8081

# ===== BASE DE DATOS: H2 (temporal, hasta tener MySQL) =====
spring.datasource.url=jdbc:h2:file:./data/dmh_users
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== BASE DE DATOS: MySQL (descomentar cuando esté disponible) =====
#spring.datasource.url=jdbc:mysql://localhost:3306/dmh_users
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=root

# ===== Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true